<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LQD to SLC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>LQD &rarr; SLC</h1>

    <a id="download" class="pick" hidden>Download .slc</a>
  </main>
  <script src="converter.js"></script>
  <script src="app.js"></script>
</body>
</html>
